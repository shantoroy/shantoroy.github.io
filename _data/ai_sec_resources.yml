# Curated resources shown on /ai-sec-hub/. Edit freely: add a category or an item and commit.
# tabs: any of aisec (AI Security), ai (AI), cyber (Cybersecurity)

- category: "Frameworks & Standards"
  tabs: [aisec]
  items:
    - {name: "OWASP GenAI Security Project", url: "https://genai.owasp.org/", desc: "Home of the OWASP Top 10 for LLM Applications and agentic AI security guidance."}
    - {name: "OWASP Top 10 for LLM Applications", url: "https://genai.owasp.org/llm-top-10/", desc: "The ten most critical risks for LLM-based applications."}
    - {name: "MITRE ATLAS", url: "https://atlas.mitre.org/", desc: "Adversarial threat landscape for AI systems: tactics, techniques and case studies."}
    - {name: "NIST AI Risk Management Framework", url: "https://www.nist.gov/itl/ai-risk-management-framework", desc: "Voluntary framework for managing risks of AI systems."}
    - {name: "NIST Adversarial Machine Learning Taxonomy", url: "https://csrc.nist.gov/pubs/ai/100/2/e2025/final", desc: "NIST AI 100-2: taxonomy and terminology of attacks and mitigations."}
    - {name: "Google Secure AI Framework (SAIF)", url: "https://saif.google/", desc: "Google's conceptual framework for securing AI systems."}
    - {name: "CSA AI Safety Initiative", url: "https://cloudsecurityalliance.org/ai-safety-initiative", desc: "Cloud Security Alliance guidance and research on secure AI adoption."}
    - {name: "AI Incident Database", url: "https://incidentdatabase.ai/", desc: "Searchable collection of real-world AI failures and harms."}

- category: "AI Red Teaming & Defense Tools"
  tabs: [aisec]
  items:
    - {name: "garak", url: "https://github.com/NVIDIA/garak", desc: "NVIDIA's LLM vulnerability scanner."}
    - {name: "PyRIT", url: "https://github.com/Azure/PyRIT", desc: "Microsoft's Python Risk Identification Tool for generative AI red teaming."}
    - {name: "promptfoo", url: "https://github.com/promptfoo/promptfoo", desc: "Test, evaluate and red-team prompts, agents and RAG pipelines."}
    - {name: "LLM Guard", url: "https://github.com/protectai/llm-guard", desc: "Input and output scanners for LLM interactions."}
    - {name: "NeMo Guardrails", url: "https://github.com/NVIDIA/NeMo-Guardrails", desc: "Programmable guardrails for LLM-based conversational systems."}
    - {name: "Guardrails AI", url: "https://github.com/guardrails-ai/guardrails", desc: "Validate and structure LLM inputs and outputs."}
    - {name: "Adversarial Robustness Toolbox", url: "https://github.com/Trusted-AI/adversarial-robustness-toolbox", desc: "Python library for evasion, poisoning, extraction and inference attacks and defenses."}
