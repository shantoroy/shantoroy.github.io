name: AI & Cybersecurity Hub

on:
  schedule:
    - cron: "45 */8 * * *" # three times a day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-sec-hub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Collect, classify and summarize
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ai_sec_hub.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ai-sec-hub
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update AI & cybersecurity hub data"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
